server {
  listen 80;
  server_name _;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.lumm.uneb.br https://www.clarity.ms https://*.clarity.ms; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; img-src 'self' data: blob: https:; manifest-src 'self'; media-src 'self' https:; object-src 'none'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms 'sha256-Law3st0tekpXQYTuuYUM55yUdbjkq4ZJkjp1XIu8hTY=' 'sha256-xSOqDKlDkW/N2wLY6lw1B5Dqf1GRLRMqxLa7FPkWxQA=' 'sha256-zfDqMe7H1LhA6vEYZGCSW5OWg1LvkgrzXcyFha9ArGA=' 'sha256-3Mh2FRq1uxOzPPBb3jX1/T7OtWJxvM2MVbXNZkAOGq0=' 'sha256-PKZwjajfa71OJY8OMQuAD0SYpKtA4MIAFx+WMRZJ0rs=' 'sha256-JkI93f1uMXnId2fYKpEjX5EyXdRtW990KUcntNfHMeg=' 'sha256-6Ojge1kHteiTYIrXHt7Ho/POjEt1ir8kHok+UCNB0gQ=' 'sha256-F0krXFI8p+32KLmLnS9M0H+99kFKD46bgEIiyTsCIq8=' 'sha256-pWoVpLwb0c7oD54YL9S332pzkaHAniFPATUYqApwd7E=' 'sha256-DZ1jl9k/eMPU6cWoBkE/P1A4inbE7NCnuxcThdGFs5s=' 'sha256-H4viO34stF/smt6034RlJmypgITmqZ6Mdj4R3x8Movk=' 'sha256-pM3WD+mgVojmg5+DHykxCNhbOlbGhNzsMsNPmiyqaG4=' 'sha256-0D8a2LkqXOq0ScQG7zJ/5Abh72o1vZIVu98ModgmOI8=' 'sha256-443tdV0pBOJpA6CJebtNqvOIGUihCY+u8zGCPZWbhG0=' 'sha256-Nm3l9ISZtbZyZHNFP7jDZDVNcwLA7MP0fYJHApCNaBQ=' 'sha256-eX7+KDHAyr1c+nziokvSCoxwI0kfwFZFFxiU9ue0N9E=' 'sha256-TTA4rk5VcYpCVQnq+kTTz3kG5OxPtu9tByslUTGIHF8=' 'sha256-/PaSIc7MH3oTGmSylE81dJvXhudm6y15HCgv7gHnGQs=' 'sha256-yFi+O0hypFrbBAfvXAc7UMlFeV8A4/wKdkjhQrrNDuw=' 'sha256-Jw6Kl7c4CEH+9XbZ6G6l4nu/KqvDokkOM9powFSZDPA=' 'sha256-gezLGORiPgY2vBVmpeRfQtnwwl8ItAIPBFqHGXPRrxU=' 'sha256-kQR2LGtIizUdAab8dbW9hTglqE9Y4SNNJWXol6SGNZw=' 'sha256-0ZdRSToj1fgy/qKsNXLH0hx04A3XI/S06yDONt4Iyxs=' 'sha256-kSBTSeTjWOvGzydTckGYV60BRU+mR+s04+gUlOKDWZs=' 'sha256-3M+MmAnYyP/j8zFBC81pq5lCflhIpgh3foYcAvf7VEo=' 'sha256-45WVnKTHLTEhs1wutqIcydKmBJ5cjdlJDjLgMSyGA70=' 'sha256-WOd7gIdF4HkbhdopOWLZEr0YOhIC6r0Ky9nnBa6uSrM=' 'sha256-RyhbweE5CbLoWYKt+/KMWV/Sim+eGU1r0N5n3wrxGt4=' 'sha256-F6JKgd9PhGeqlW0KKG1Otj967dajG2Iw+EV60m3ce/s=' 'sha256-5k3GJutfx